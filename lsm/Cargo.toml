[package]
name = "lsm"
version = "0.1.0"
edition = "2024"

[lib]
name = "lsm"

crate-type = ["cdylib"]

[dependencies]
rand = "0.9.0-alpha.0"

itertools = "0.10.0"

candle-nn = "0.9.1"
candle-core = "0.9.1"

plotly = "0.8.4"

ndarray = "0.15.6"
ndarray-rand = "0.14.0"
ndarray-npz = "0.1.0"

[dependencies.pyo3]
version = "0.25.1"
features = ["extension-module"]

[target.x86_64-apple-darwin]
rustflags = [
    "-C", "link-arg=-undefined",
    "-C", "link-arg=dynamic_lookup",
]

[target.aarch64-apple-darwin]
rustflags = [
    "-C", "link-arg=-undefined",
    "-C", "link-arg=dynamic_lookup",
]